<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<title>City in Check — NYC Chess Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>

<!-- Netlify Forms detection — parsed from the static HTML at deploy time, kept
     outside the React root since Netlify does not execute JS to find forms. -->
<form name="join-community" data-netlify="true" hidden>
  <input name="name"><input name="email"><input name="skill-level">
  <input name="event-interests"><input name="boroughs">
  <input name="chess-handle"><input name="lichess-handle"><input name="notifications">
</form>

<script type="module" src="/src/main-home.jsx"></script>
</body>
</html>
