<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeremy — Illustrator & Emote Artist</title>
<meta name="description" content="Jeremy is an illustrator making character art, Twitch/Discord emotes, custom profile photos and stickers. Commission info and portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>

<!-- Static copy for Netlify's build-time form bot to detect; the real form is rendered by React in Portfolio.jsx -->
<form name="commission-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="text" name="channel" />
  <input type="text" name="category" />
  <textarea name="message"></textarea>
  <input type="text" name="references" />
  <input type="date" name="needed-by" />
  <select name="budget"><option>Prefer not to say</option><option>Under $50</option><option>$50 – $150</option><option>$150 – $300</option><option>$300+</option></select>
  <input type="text" name="bot-field" />
</form>

<script type="module" src="/src/main-portfolio.jsx"></script>
</body>
</html>
